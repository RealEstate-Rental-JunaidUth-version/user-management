# application-test.properties for user-management-service
spring.cloud.config.enabled=false
spring.profiles.active=dev
spring.application.name=user-management-service

# Local Datasource (H2)
spring.datasource.url=${DEV_DB_URL:jdbc:h2:mem:userdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always

# Eureka settings (disabled for local testing)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
